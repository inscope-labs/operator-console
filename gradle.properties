# --- Gradle -------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# --- Android ------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin -------------------------------------------------------------------
kotlin.code.style=official

# --- Constrained environments --------------------------------------------------
# On a small container (under ~4 GB) the Gradle daemon and the Kotlin compile
# daemon together can exhaust memory. Drop these two lines and lower the heap:
#
#   org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
#   org.gradle.parallel=false
#   kotlin.compiler.execution.strategy=in-process
