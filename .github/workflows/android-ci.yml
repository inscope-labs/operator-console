# CI for operator-console: release posture check, JVM unit tests, a DEBUG build, and an unsigned RELEASE
# compile (PoC task 42). Nothing here signs or publishes a release; the release APK is built to prove the
# release variant (R8 shrinking, release DI graph) compiles, and is not uploaded.
# This file is a protected path for the AI Studio agent; change it out-of-band.
name: android-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Release posture check
        # T7-102 / PoC task 44. Fails the build when the release variant has
        # regressed: scaffold markers in shipped sources, a placeholder host, a
        # missing or near-expiry pin set, cleartext in the release config, the
        # Lab engine or HMAC signer in the release source set, or a debug
        # keystore / emulator host in the release build type.
        run: python3 scripts/release-check.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: JVM unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest 2>&1 | tee gradle-unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A8 "What went wrong|FAILED|^e: |error:" gradle-unit.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle unit tests failed::${msg}"
            # The Gradle log carries only the exception class; the assertion message is in the XML report.
            detail=$(grep -h -A6 "<failure message=" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | cut -c1-1500 | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$detail" ]; then echo "::error title=Failed test messages::${detail}"; fi
          fi
          exit "$status"

      - name: Create a throwaway debug keystore
        # app/build.gradle.kts signs debug builds with ${rootDir}/debug.keystore, which is gitignored.
        # This one exists only for this CI run and signs nothing that ships.
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Debug build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A8 "What went wrong|FAILED|^e: |error:" gradle-build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle debug build failed::${msg}"
          fi
          exit "$status"

      - name: Release KSP (dependency-injection graph)
        # PoC task 42 / MP DI-03. Compiles the release DI graph on its own so a missing binding is reported
        # as a KSP failure, not buried inside the full release build.
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:kspReleaseKotlin 2>&1 | tee gradle-ksp-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A8 "What went wrong|FAILED|^e: |error:" gradle-ksp-release.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle release KSP failed::${msg}"
          fi
          exit "$status"

      - name: Release build (unsigned, not uploaded)
        # PoC task 42 / MP BLD-01. The release type has no signing config, so this produces an unsigned APK
        # after R8 shrinking. A ProGuard or resource-shrinking regression fails here, not on a device.
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease 2>&1 | tee gradle-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A8 "What went wrong|FAILED|^e: |error:" gradle-release.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle release build failed::${msg}"
          fi
          exit "$status"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  vectors-are-reproducible:
    # The conformance vectors are generated, never hand-edited: regenerating must change nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the reference generator's dependency
        run: python -m pip install "cryptography>=43"

      - name: Regenerate vectors
        run: python docs/fixtures/vectors/generate_vectors.py

      - name: Fail if the committed vectors differ
        run: git diff --exit-code -- docs/fixtures/vectors
