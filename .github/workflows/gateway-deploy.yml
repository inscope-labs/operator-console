name: Gateway Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run generate-wrangler
      - run: npm run check-repo-privacy
      - run: npm run verify-log-hygiene
      # PoC task 47. The deploy is gated on the unit tests and the conformance suite
      # (gateway/tests/conformance: capability vectors, V1, V5, V9, V10). V2-V4, V6-V8, V11 and V12
      # have no conformance test yet, so this gate does not claim V1-V12; add each as it is written.
      # Promotion to `production` additionally needs the required-reviewer rule on the `production`
      # GitHub environment (repository settings; an operator decision, not set by this file).
      - run: npm run test:unit
      - run: npm run test:conformance
      - name: Deploy
        run: npx wrangler deploy --env ${{ inputs.environment }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
