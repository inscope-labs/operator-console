name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint || true
      - run: npm run test:unit || true
      - run: npm run verify-log-hygiene || true
      # TODO: enable full gates once implementations land
